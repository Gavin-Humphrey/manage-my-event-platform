<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Editorial Minimalist</title>
</head>
<body class="bg-[#FAFAFA] text-[#111111] font-serif antialiased px-6 py-16 md:py-24">
    <div class="max-w-xl mx-auto text-center">
        <p class="text-xs uppercase tracking-[0.2em] text-neutral-500 mb-4">Private Exhibition</p>
        <h1 class="text-4xl md:text-6xl font-normal tracking-tight mb-6">An Evening of Modern Sculpture</h1>
        <p class="text-neutral-600 font-sans text-sm mb-12">October 18, 2026 • Marais Gallery, Paris</p>
        <div class="border-y border-neutral-200 py-8 mb-10 text-left">
            <p class="font-sans text-neutral-700 text-sm leading-relaxed italic text-center">"An intimate exploration of spatial geometry, form, and tactile materials in contemporary European sculpture."</p>
        </div>
        <div class="bg-white border border-neutral-200 p-8 rounded-lg shadow-sm text-left">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="font-sans font-semibold text-neutral-900">Standard Admission</h3>
                    <p class="font-sans text-xs text-neutral-500">Includes catalog & champagne</p>
                </div>
                <span class="font-sans text-xl font-medium">$65</span>
            </div>
            <button class="w-full bg-neutral-900 text-white font-sans text-sm tracking-wider uppercase py-3 rounded hover:bg-neutral-800 transition">Reserve Invitation</button>
        </div>
    </div>
</body>
</html>
