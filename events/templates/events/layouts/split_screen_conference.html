<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Split-Screen Conference</title>
</head>
<body class="bg-white text-slate-900 font-sans antialiased">
    <div class="min-h-screen grid grid-cols-1 lg:grid-cols-12">
        <div class="lg:col-span-5 lg:sticky lg:top-0 h-fit lg:h-screen p-8 md:p-12 bg-slate-50 border-r border-slate-200 flex flex-col justify-between">
            <div>
                <span class="px-3 py-1 bg-blue-100 text-blue-700 text-xs font-semibold rounded-full">Annual Tech Summit</span>
                <h1 class="text-3xl font-bold tracking-tight mt-4 mb-2">Global Cloud Architecture 2026</h1>
                <p class="text-slate-600 text-sm mb-6">Oct 12, 2026 • Palais des Congrès, Paris</p>
                <div class="space-y-4 border-t border-slate-200 pt-6">
                    <div class="flex justify-between items-center"><span class="font-medium">General Ticket</span><span class="font-bold text-lg">$150</span></div>
                </div>
            </div>
            <button class="w-full mt-8 bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition shadow-sm">Proceed to Checkout</button>
        </div>
        <div class="lg:col-span-7 p-8 md:p-16 overflow-y-auto space-y-12">
            <section>
                <h2 class="text-2xl font-bold mb-4">Event Overview</h2>
                <p class="text-slate-600 leading-relaxed">A deep-dive technical conference bringing together principal engineers, database administrators, and cloud platform architects to explore scalable infrastructure.</p>
            </section>
        </div>
    </div>
</body>
</html>
